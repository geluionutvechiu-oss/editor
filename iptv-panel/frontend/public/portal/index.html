<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Portal — Autentificare</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #4fc3f7;
    --text: #e2e8f0;
    --muted: #64748b;
    --red: #ef4444;
    --green: #22c55e;
    --orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: radial-gradient(ellipse at 50% 40%, #1a1030 0%, var(--bg) 70%);
  }
  .login-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 40px; width: 380px;
    box-shadow: 0 25px 60px rgba(0,0,0,.7);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo svg { width: 52px; height: 52px; margin-bottom: 12px; }
  .logo h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo p { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .field input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: .95rem;
    outline: none; transition: border .2s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%; padding: 13px; background: linear-gradient(135deg,var(--accent),#8b5cf6);
    border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: opacity .2s, transform .1s;
  }
  .btn-login:hover { opacity: .9; }
  .btn-login:active { transform: scale(.98); }
  .btn-login:disabled { opacity: .5; cursor: not-allowed; }
  .err-msg { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); border-radius: 8px; padding: 10px 14px; color: var(--red); font-size: .85rem; margin-top: 14px; display: none; }

  /* ── PLAYER ── */
  #player-screen { display: none; height: 100vh; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* sidebar */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .user-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg,var(--accent),#8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; flex-shrink: 0; }
  .user-info .name { font-size: .9rem; font-weight: 600; }
  .user-info .exp { font-size: .75rem; color: var(--muted); }
  .search-box { position: relative; }
  .search-box input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 34px; color: var(--text); font-size: .85rem; outline: none; }
  .search-box::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: .8rem; pointer-events: none; }
  .category-tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: .75rem; cursor: pointer; white-space: nowrap; transition: all .2s; }
  .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .channel-list { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .channel-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; transition: background .15s; border-left: 3px solid transparent; }
  .channel-item:hover { background: var(--bg3); }
  .channel-item.active { background: rgba(108,99,255,.15); border-left-color: var(--accent); }
  .channel-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: var(--bg3); flex-shrink: 0; }
  .channel-logo-placeholder { width: 36px; height: 36px; background: var(--bg3); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--muted); flex-shrink: 0; }
  .channel-info { min-width: 0; }
  .channel-name { font-size: .85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-epg { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .epg-now { color: var(--accent2); }

  /* main player area */
  .main { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .video-wrap { position: relative; flex: 1; background: #000; min-height: 0; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* overlay info */
  .overlay-info { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 14px; display: none; max-width: 320px; }
  .overlay-info.show { display: block; }
  .overlay-title { font-size: 1rem; font-weight: 700; }
  .overlay-epg { font-size: .78rem; color: var(--accent2); margin-top: 3px; }
  .live-badge { position: absolute; top: 16px; right: 16px; background: var(--red); color: #fff; font-size: .7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
  .live-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* controls */
  .controls {
    padding: 12px 16px; background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .ctrl-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); cursor: pointer; font-size: .85rem; transition: background .15s; white-space: nowrap; }
  .ctrl-btn:hover { background: var(--border); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); }
  .vol-wrap { display: flex; align-items: center; gap: 6px; flex: 1; max-width: 160px; }
  .vol-icon { font-size: 1rem; cursor: pointer; user-select: none; }
  input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .quality-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); font-size: .82rem; cursor: pointer; }
  .ctrl-right { margin-left: auto; display: flex; gap: 8px; }
  .logout-btn { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); border-radius: 8px; padding: 7px 12px; color: var(--red); cursor: pointer; font-size: .82rem; }
  .logout-btn:hover { background: rgba(239,68,68,.25); }

  /* epg strip */
  .epg-strip { height: 68px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
  .epg-strip::-webkit-scrollbar { display: none; }
  .epg-item { flex-shrink: 0; padding: 8px 14px; border-right: 1px solid var(--border); cursor: default; transition: background .15s; }
  .epg-item:hover { background: var(--bg3); }
  .epg-item.now { background: rgba(108,99,255,.1); border-bottom: 2px solid var(--accent); }
  .epg-time { font-size: .7rem; color: var(--muted); }
  .epg-title-s { font-size: .78rem; font-weight: 500; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* loading overlay */
  .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .buffering-msg { color: var(--muted); font-size: .85rem; margin-top: 12px; }
  .error-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  .error-overlay .icon { font-size: 3rem; }
  .error-overlay p { color: var(--muted); font-size: .9rem; }
  .retry-btn { background: var(--accent); border: none; border-radius: 8px; padding: 10px 24px; color: #fff; font-size: .9rem; cursor: pointer; }

  /* mobile responsive */
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform .3s; z-index: 100; }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.5); }
    .sidebar-toggle { display: flex !important; }
    .epg-strip { display: none; }
  }
  .sidebar-toggle { display: none; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); cursor: pointer; font-size: .85rem; }
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 52 52" fill="none">
        <rect width="52" height="52" rx="14" fill="url(#g)"/>
        <path d="M18 16 L18 36 L38 26 Z" fill="white"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="52" y2="52"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#4fc3f7"/></linearGradient></defs>
      </svg>
      <h1>IPTV Portal</h1>
      <p>Conectează-te cu datele tale de abonament</p>
    </div>

    <form id="login-form">
      <div class="field">
        <label>Utilizator</label>
        <input id="f-user" type="text" placeholder="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Parolă</label>
        <input id="f-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn-login" type="submit" id="btn-submit">Intră în Portal</button>
      <div class="err-msg" id="err-msg"></div>
    </form>
  </div>
</div>

<!-- ══════════════ PLAYER ══════════════ -->
<div id="player-screen">
  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-badge">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-info">
            <div class="name" id="user-display-name">–</div>
            <div class="exp" id="user-exp">–</div>
          </div>
        </div>
        <div class="search-box">
          <input id="search-input" type="text" placeholder="Caută canal..." autocomplete="off">
        </div>
      </div>
      <div class="category-tabs" id="category-tabs"></div>
      <div class="channel-list" id="channel-list"></div>
    </div>

    <!-- Main -->
    <div class="main">
      <!-- Video -->
      <div class="video-wrap" id="video-wrap">
        <video id="video" playsinline></video>

        <div class="overlay-info" id="overlay-info">
          <div class="overlay-title" id="overlay-title">–</div>
          <div class="overlay-epg" id="overlay-epg"></div>
        </div>

        <div class="live-badge" id="live-badge" style="display:none">
          <div class="live-dot"></div> LIVE
        </div>

        <!-- Loading -->
        <div class="loading-overlay" id="loading-overlay" style="display:none">
          <div style="text-align:center">
            <div class="spinner"></div>
            <div class="buffering-msg" id="buf-msg">Se încarcă...</div>
          </div>
        </div>

        <!-- Error -->
        <div class="error-overlay" id="error-overlay" style="display:none">
          <div class="icon">📡</div>
          <p id="error-msg">Stream indisponibil momentan.</p>
          <button class="retry-btn" id="retry-btn">Reîncearcă</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="sidebar-toggle ctrl-btn" id="sidebar-toggle">☰ Canale</button>
        <button class="ctrl-btn" id="btn-play">⏸</button>
        <div class="vol-wrap">
          <span class="vol-icon" id="vol-icon">🔊</span>
          <input type="range" id="vol-slider" min="0" max="100" value="80">
        </div>
        <select class="quality-select" id="quality-select">
          <option value="-1">Auto</option>
        </select>
        <div class="ctrl-right">
          <button class="ctrl-btn" id="btn-fs">⛶ Fullscreen</button>
          <button class="logout-btn" id="btn-logout">Deconectare</button>
        </div>
      </div>

      <!-- EPG Strip -->
      <div class="epg-strip" id="epg-strip"></div>
    </div>
  </div>
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
(function() {
  'use strict';

  // ── Config ───────────────────────────────────────────────────────────────
  const API_BASE = window.location.origin;
  const SESSION_KEY = 'iptv_portal_session';

  // ── State ────────────────────────────────────────────────────────────────
  let session = null;    // { username, password, user_info }
  let categories = [];
  let allChannels = [];  // tutti i canali flat
  let filteredChannels = [];
  let currentCatId = 'all';
  let currentChannel = null;
  let hls = null;
  let retryCount = 0;
  const MAX_RETRY = 3;
  let overlayTimer = null;

  // ── Elements ─────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const loginScreen    = $('login-screen');
  const playerScreen   = $('player-screen');
  const loginForm      = $('login-form');
  const fUser          = $('f-user');
  const fPass          = $('f-pass');
  const btnSubmit      = $('btn-submit');
  const errMsg         = $('err-msg');
  const video          = $('video');
  const loadingOverlay = $('loading-overlay');
  const errorOverlay   = $('error-overlay');
  const errorMsg       = $('error-msg');
  const liveBadge      = $('live-badge');
  const overlayInfo    = $('overlay-info');
  const overlayTitle   = $('overlay-title');
  const overlayEpg     = $('overlay-epg');
  const categoryTabs   = $('category-tabs');
  const channelList    = $('channel-list');
  const searchInput    = $('search-input');
  const btnPlay        = $('btn-play');
  const volSlider      = $('vol-slider');
  const volIcon        = $('vol-icon');
  const qualitySelect  = $('quality-select');
  const btnFs          = $('btn-fs');
  const btnLogout      = $('btn-logout');
  const epgStrip       = $('epg-strip');
  const bufMsg         = $('buf-msg');
  const retryBtn       = $('retry-btn');
  const sidebar        = $('sidebar');
  const sidebarToggle  = $('sidebar-toggle');

  // ── Helpers ──────────────────────────────────────────────────────────────
  function showError(msg) { errMsg.textContent = msg; errMsg.style.display = 'block'; }
  function hideError()    { errMsg.style.display = 'none'; }
  function showLoading()  { loadingOverlay.style.display = 'flex'; errorOverlay.style.display = 'none'; }
  function hideLoading()  { loadingOverlay.style.display = 'none'; }
  function showStreamError(msg) { hideLoading(); errorOverlay.style.display = 'flex'; errorMsg.textContent = msg || 'Stream indisponibil.'; }

  function xtreamUrl(action, extra = '') {
    return `${API_BASE}/player_api.php?username=${encodeURIComponent(session.username)}&password=${encodeURIComponent(session.password)}&action=${action}${extra}`;
  }

  async function xtreamFetch(action, extra = '') {
    const r = await fetch(xtreamUrl(action, extra));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  function streamUrl(id) {
    return `${API_BASE}/live/${encodeURIComponent(session.username)}/${encodeURIComponent(session.password)}/${id}`;
  }

  function formatExpiry(dateStr) {
    if (!dateStr) return 'Fără expirare';
    const d = new Date(parseInt(dateStr) * 1000);
    if (isNaN(d)) return dateStr;
    const now = new Date();
    const diff = Math.ceil((d - now) / 86400000);
    if (diff < 0) return '⚠️ Expirat';
    if (diff === 0) return '⚠️ Expiră azi';
    if (diff <= 7) return `⚠️ Expiră în ${diff} zile`;
    return `✓ Valid până ${d.toLocaleDateString('ro-RO')}`;
  }

  function timeStr(unix) {
    const d = new Date(unix * 1000);
    return d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  }

  // ── Login ────────────────────────────────────────────────────────────────
  async function doLogin(username, password) {
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Se verifică...';
    hideError();

    try {
      const r = await fetch(
        `${API_BASE}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
      );
      if (!r.ok) throw new Error('Server error');
      const data = await r.json();

      if (!data.user_info || data.user_info.auth !== 1) {
        throw new Error('Utilizator sau parolă incorectă.');
      }

      session = { username, password, user_info: data.user_info };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

      await startPlayer();
    } catch (err) {
      showError(err.message || 'Eroare de conectare. Verifică datele.');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Intră în Portal';
    }
  }

  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    doLogin(fUser.value.trim(), fPass.value);
  });

  // ── Start player după login ───────────────────────────────────────────────
  async function startPlayer() {
    loginScreen.style.display = 'none';
    playerScreen.style.display = 'block';

    // Info user în sidebar
    const ui = session.user_info;
    $('user-display-name').textContent = ui.username || session.username;
    $('user-avatar').textContent = (ui.username || session.username)[0].toUpperCase();
    $('user-exp').textContent = formatExpiry(ui.exp_date);

    showLoading();
    bufMsg.textContent = 'Se încarcă lista de canale...';

    try {
      const [cats, streams] = await Promise.all([
        xtreamFetch('get_live_categories'),
        xtreamFetch('get_live_streams')
      ]);

      categories = Array.isArray(cats) ? cats : [];
      allChannels = Array.isArray(streams) ? streams : [];

      buildCategoryTabs();
      filterAndRenderChannels();
      hideLoading();

      // Auto-play primul canal dacă există
      if (allChannels.length > 0) {
        playChannel(allChannels[0]);
      }
    } catch (err) {
      showStreamError('Nu s-a putut încărca lista de canale.');
      console.error(err);
    }
  }

  // ── Category tabs ────────────────────────────────────────────────────────
  function buildCategoryTabs() {
    categoryTabs.innerHTML = '';

    const all = document.createElement('button');
    all.className = 'cat-btn active';
    all.textContent = 'Toate';
    all.dataset.id = 'all';
    all.addEventListener('click', () => setCategory('all'));
    categoryTabs.appendChild(all);

    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.textContent = cat.category_name;
      btn.dataset.id = cat.category_id;
      btn.addEventListener('click', () => setCategory(cat.category_id));
      categoryTabs.appendChild(btn);
    });
  }

  function setCategory(id) {
    currentCatId = id;
    document.querySelectorAll('.cat-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.id === String(id));
    });
    filterAndRenderChannels();
  }

  // ── Channel rendering ────────────────────────────────────────────────────
  function filterAndRenderChannels() {
    const q = searchInput.value.toLowerCase();
    filteredChannels = allChannels.filter(ch => {
      const matchCat = currentCatId === 'all' || String(ch.category_id) === String(currentCatId);
      const matchQ   = !q || ch.name.toLowerCase().includes(q);
      return matchCat && matchQ;
    });
    renderChannelList();
  }

  function renderChannelList() {
    channelList.innerHTML = '';
    if (!filteredChannels.length) {
      channelList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:.85rem">Niciun canal găsit</div>';
      return;
    }

    const frag = document.createDocumentFragment();
    filteredChannels.forEach(ch => {
      const item = document.createElement('div');
      item.className = 'channel-item' + (currentChannel?.stream_id === ch.stream_id ? ' active' : '');
      item.dataset.sid = ch.stream_id;

      const epgNow = ch.epg_now || '';
      item.innerHTML = `
        ${ch.stream_icon
          ? `<img class="channel-logo" src="${escHtml(ch.stream_icon)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="channel-logo-placeholder">📺</div>`
        }
        <div class="channel-info">
          <div class="channel-name">${escHtml(ch.name)}</div>
          ${epgNow ? `<div class="channel-epg epg-now">${escHtml(epgNow)}</div>` : ''}
        </div>`;

      item.addEventListener('click', () => {
        playChannel(ch);
        if (window.innerWidth <= 720) sidebar.classList.remove('open');
      });
      frag.appendChild(item);
    });
    channelList.appendChild(frag);
  }

  searchInput.addEventListener('input', filterAndRenderChannels);

  // ── Play channel ─────────────────────────────────────────────────────────
  function playChannel(ch) {
    currentChannel = ch;
    retryCount = 0;

    // Highlight
    document.querySelectorAll('.channel-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sid == ch.stream_id);
    });

    const url = streamUrl(ch.stream_id);

    // Overlay info
    overlayTitle.textContent = ch.name;
    overlayEpg.textContent   = ch.epg_now || '';
    showOverlay();

    liveBadge.style.display = 'flex';
    showLoading();
    bufMsg.textContent = `Se conectează la ${ch.name}...`;

    loadStream(url);
    loadEpgStrip(ch.stream_id, ch.epg_channel_id || '');
  }

  function loadStream(url) {
    if (hls) { hls.destroy(); hls = null; }
    errorOverlay.style.display = 'none';

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 60,
        maxBufferLength: 30,
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 3,
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        hideLoading();
        populateQuality(data.levels);
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          if (retryCount < MAX_RETRY) {
            retryCount++;
            bufMsg.textContent = `Reconectare (${retryCount}/${MAX_RETRY})...`;
            showLoading();
            setTimeout(() => loadStream(url), 2500);
          } else {
            showStreamError('Stream indisponibil. Încearcă mai târziu sau alege alt canal.');
          }
        }
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      video.src = url;
      video.addEventListener('loadedmetadata', () => { hideLoading(); video.play(); }, { once: true });
      video.addEventListener('error', () => {
        if (retryCount < MAX_RETRY) {
          retryCount++;
          setTimeout(() => loadStream(url), 2500);
        } else {
          showStreamError('Stream indisponibil.');
        }
      }, { once: true });
    } else {
      showStreamError('Browser-ul tău nu suportă redare HLS.');
    }
  }

  retryBtn.addEventListener('click', () => {
    if (currentChannel) { retryCount = 0; playChannel(currentChannel); }
  });

  // ── Quality selector ─────────────────────────────────────────────────────
  function populateQuality(levels) {
    qualitySelect.innerHTML = '<option value="-1">Auto</option>';
    levels.forEach((l, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = l.height ? `${l.height}p` : `Calitate ${i + 1}`;
      qualitySelect.appendChild(opt);
    });
  }

  qualitySelect.addEventListener('change', () => {
    if (hls) hls.currentLevel = parseInt(qualitySelect.value);
  });

  // ── EPG strip ─────────────────────────────────────────────────────────────
  async function loadEpgStrip(streamId, epgChannelId) {
    epgStrip.innerHTML = '';
    if (!epgChannelId) return;
    try {
      const data = await xtreamFetch('get_short_epg', `&stream_id=${streamId}&limit=10`);
      const items = data?.epg_listings || [];
      const now = Math.floor(Date.now() / 1000);

      items.forEach(item => {
        const start = parseInt(item.start_timestamp);
        const end   = parseInt(item.stop_timestamp);
        const title = atob(item.title || '');
        const isNow = start <= now && now < end;

        const el = document.createElement('div');
        el.className = 'epg-item' + (isNow ? ' now' : '');
        el.innerHTML = `<div class="epg-time">${timeStr(start)} – ${timeStr(end)}</div>
                        <div class="epg-title-s">${escHtml(title)}</div>`;
        epgStrip.appendChild(el);
      });

      if (epgStrip.querySelector('.now')) {
        epgStrip.querySelector('.now').scrollIntoView({ behavior: 'smooth', inline: 'center' });
      }
    } catch {}
  }

  // ── Overlay show/hide ─────────────────────────────────────────────────────
  function showOverlay() {
    overlayInfo.classList.add('show');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => overlayInfo.classList.remove('show'), 4000);
  }

  $('video-wrap').addEventListener('click', () => {
    if (!loadingOverlay.style.display || loadingOverlay.style.display === 'none') {
      showOverlay();
    }
  });

  // ── Controls ──────────────────────────────────────────────────────────────
  btnPlay.addEventListener('click', () => {
    if (video.paused) { video.play(); btnPlay.textContent = '⏸'; }
    else              { video.pause(); btnPlay.textContent = '▶'; }
  });
  video.addEventListener('play',  () => { btnPlay.textContent = '⏸'; });
  video.addEventListener('pause', () => { btnPlay.textContent = '▶'; });

  volSlider.addEventListener('input', () => {
    video.volume = volSlider.value / 100;
    video.muted  = video.volume === 0;
    volIcon.textContent = video.muted || video.volume === 0 ? '🔇' : '🔊';
  });

  volIcon.addEventListener('click', () => {
    video.muted = !video.muted;
    volIcon.textContent = video.muted ? '🔇' : '🔊';
    if (!video.muted) volSlider.value = video.volume * 100;
  });

  video.volume = 0.8;

  btnFs.addEventListener('click', () => {
    const el = $('video-wrap');
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
  });

  document.addEventListener('fullscreenchange', () => {
    btnFs.textContent = document.fullscreenElement ? '⛶ Ieși' : '⛶ Fullscreen';
  });

  // ── Logout ────────────────────────────────────────────────────────────────
  btnLogout.addEventListener('click', () => {
    if (!confirm('Te deconectezi din portal?')) return;
    sessionStorage.removeItem(SESSION_KEY);
    if (hls) hls.destroy();
    session = null;
    playerScreen.style.display = 'none';
    loginScreen.style.display  = 'flex';
    fUser.value = ''; fPass.value = '';
  });

  // ── Sidebar toggle mobil ──────────────────────────────────────────────────
  sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
  document.addEventListener('click', e => {
    if (window.innerWidth <= 720 && sidebar.classList.contains('open') &&
        !sidebar.contains(e.target) && e.target !== sidebarToggle) {
      sidebar.classList.remove('open');
    }
  });

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space':   e.preventDefault(); btnPlay.click(); break;
      case 'KeyM':    volIcon.click(); break;
      case 'KeyF':    btnFs.click(); break;
      case 'ArrowUp':
        video.volume = Math.min(1, video.volume + 0.05);
        volSlider.value = video.volume * 100; break;
      case 'ArrowDown':
        video.volume = Math.max(0, video.volume - 0.05);
        volSlider.value = video.volume * 100; break;
    }
  });

  // ── XSS escape ───────────────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Restore session ───────────────────────────────────────────────────────
  const saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) {
    try {
      session = JSON.parse(saved);
      startPlayer();
    } catch { sessionStorage.removeItem(SESSION_KEY); }
  }

})();
</script>
</body>
