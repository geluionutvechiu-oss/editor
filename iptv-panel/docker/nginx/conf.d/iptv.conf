server {
    listen 80;
    server_name _;
    root /var/www/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real IP from proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ============================================================
    # React Admin Panel - /admin
    # ============================================================
    location /admin {
        proxy_pass http://react-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Vue Player - /player
    # ============================================================
    location /player {
        proxy_pass http://vue-player:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # REST API
    # ============================================================
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================================
    # WebSocket
    # ============================================================
    location /ws {
        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================================
    # Xtream Codes API (direct endpoints)
    # ============================================================
    location ~ ^/(player_api\.php|get\.php|xmltv\.php|playlist\.m3u) {
        limit_req zone=xtream burst=30 nodelay;

        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache M3U/XMLTV for 5 minutes
        location ~ ^/(xmltv\.php|playlist\.m3u) {
            proxy_pass http://node_api;
            proxy_cache_valid 200 5m;
        }
    }

    # ============================================================
    # Stream Proxy endpoints
    # ============================================================
    location ~ ^/(live|movie|series)/(.+)/(.+)/(.+)$ {
        limit_conn conn_limit 5;

        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # HLS specific
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================================
    # EPG Microservice
    # ============================================================
    location /epg-service/ {
        proxy_pass http://python_epg/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # Web Portal — login client + player web
    # ============================================================
    location /portal {
        alias /var/www/public/portal;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /portal/ {
        alias /var/www/public/portal/;
        try_files index.html =404;
        add_header Cache-Control "no-cache";
    }

    # ============================================================
    # Static public files (embeddable player, public pages)
    # ============================================================
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip_static on;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
    location ~ /\.           { deny all; access_log off; log_not_found off; }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

