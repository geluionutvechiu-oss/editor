services:
  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: iptv_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-iptv_panel}
      MYSQL_USER: ${DB_USER:-iptv_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
      --slow_query_log=1
      --slow_query_log_file=/var/log/mysql/slow.log
      --long_query_time=2
      --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_change_me}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - iptv_net

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: iptv_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - iptv_net

  # ============================================================
  # Node.js Express API
  # ============================================================
  node-api:
    build:
      context: ../backend/node-api
      dockerfile: Dockerfile
    container_name: iptv_node_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-iptv_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      DB_NAME: ${DB_NAME:-iptv_panel}
      DB_POOL_SIZE: 20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_RANDOM_64_CHAR_STRING_IN_PRODUCTION}
      JWT_EXPIRY: 24h
      CORS_ORIGINS: ${PANEL_URL:-http://localhost}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      LOG_LEVEL: info
      LOG_DIR: /var/log/iptv
    volumes:
      - node_logs:/var/log/iptv
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - iptv_net

  # ============================================================
  # Python FastAPI EPG Microservice
  # ============================================================
  python-epg:
    build:
      context: ../backend/python-epg
      dockerfile: Dockerfile
    container_name: iptv_python_epg
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-iptv_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      DB_NAME: ${DB_NAME:-iptv_panel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
      NODE_API_URL: http://node-api:8080
      PORT: 8001
      DEBUG: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - iptv_net

  # ============================================================
  # React Admin Dashboard (built static files served by nginx)
  # ============================================================
  react-admin:
    build:
      context: ../frontend/react-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ws://${PANEL_DOMAIN:-localhost}/ws
    container_name: iptv_react_admin
    restart: unless-stopped
    networks:
      - iptv_net

  # ============================================================
  # Vue.js Player
  # ============================================================
  vue-player:
    build:
      context: ../frontend/vue-player
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_BASE_URL: ${PANEL_URL:-http://localhost}
    container_name: iptv_vue_player
    restart: unless-stopped
    networks:
      - iptv_net

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: iptv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl
      - ../frontend/public:/var/www/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - node-api
      - python-epg
      - react-admin
      - vue-player
    networks:
      - iptv_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  node_logs:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local

networks:
  iptv_net:
    driver: bridge
