services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: iptv_panel
      POSTGRES_USER: iptv_user
      POSTGRES_PASSWORD: secret123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv_user -d iptv_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:d2l0aHN1cGVyc2VjcmV0a2V5MTIzNDU2Nzg5MA==
      APP_URL: http://localhost:8081
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: iptv_panel
      DB_USERNAME: iptv_user
      DB_PASSWORD: secret123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecretjwtkey123456789012345678901234
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan horizon
    depends_on:
      - backend
    environment:
      APP_ENV: production
      APP_KEY: base64:d2l0aHN1cGVyc2VjcmV0a2V5MTIzNDU2Nzg5MA==
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: iptv_panel
      DB_USERNAME: iptv_user
      DB_PASSWORD: secret123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
      NEXT_PUBLIC_APP_NAME: IPTV Panel
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
